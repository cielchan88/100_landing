{% extends 'base.html' %}

{% block title %}Reasoning Reps — Day 4 of 100 Days with Claude{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='day04/reasoning_reps.css') }}">

<div class="max-w-3xl mx-auto px-4 sm:px-6 py-10">

  <a href="/" class="text-sm inline-flex items-center gap-2"
     style="color: var(--muted);"
     onmouseover="this.style.color='var(--accent-hover)'"
     onmouseout="this.style.color='var(--muted)'">
    <span aria-hidden="true">←</span> Back to all days
  </a>

  <div class="mt-6 mb-6">
    <p class="mono text-xs" style="color: var(--accent);">Day 04 · Reasoning Reps</p>
  </div>

  {% block d04_content %}{% endblock %}

</div>

<script src="{{ url_for('static', filename='day04/reasoning_reps.js') }}"></script>
{% endblock %}
