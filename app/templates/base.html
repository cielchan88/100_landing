<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title or '100 Days with Claude' }}</title>

  <meta name="description" content="Membangun satu proyek web setiap hari, selama 100 hari.">
  <meta name="theme-color" content="#0F0F0E">

  <meta property="og:title" content="100 Days with Claude">
  <meta property="og:description" content="Membangun satu proyek web setiap hari, selama 100 hari.">
  <meta property="og:url" content="{{ site_url }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="100 Days with Claude">
  <meta name="twitter:description" content="Membangun satu proyek web setiap hari, selama 100 hari.">

  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg: #0F0F0E;
      --bg-elev: #181715;
      --bg-elev-2: #1F1E1B;
      --fg: #FAFAF7;
      --fg-muted: #A8A29E;
      --accent: #D97757;
      --accent-bright: #E8916F;
      --border: rgba(217, 119, 87, 0.15);
      --border-strong: rgba(217, 119, 87, 0.4);
      --code-bg: #14130F;
    }

    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    html { background: var(--bg); }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-feature-settings: "ss01", "cv11";
    }

    .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    ::selection { background: var(--accent); color: var(--bg); }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--accent);
      color: var(--bg);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      z-index: 100;
    }
    .skip-link:focus { left: 1rem; top: 1rem; }

    .day-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      transition: transform 200ms ease, border-color 200ms ease, background 200ms ease;
    }
    .day-card:hover {
      background: var(--bg-elev-2);
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .day-card:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }

    .prose-claude { max-width: 65ch; }
    .prose-claude p { font-size: 1rem; line-height: 1.75; margin-bottom: 1rem; color: var(--fg); }
    .prose-claude h1, .prose-claude h2, .prose-claude h3, .prose-claude h4 {
      color: var(--fg);
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-top: 2.25rem;
      margin-bottom: 1rem;
      line-height: 1.25;
    }
    .prose-claude h1 { font-size: 2rem; }
    .prose-claude h2 { font-size: 1.5rem; }
    .prose-claude h3 { font-size: 1.25rem; }
    .prose-claude h4 { font-size: 1.05rem; }
    .prose-claude a { color: var(--accent-bright); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 150ms ease; }
    .prose-claude a:hover { border-bottom-color: var(--accent-bright); }
    .prose-claude ul, .prose-claude ol { padding-left: 1.5rem; margin-bottom: 1rem; }
    .prose-claude ul { list-style: disc; }
    .prose-claude ol { list-style: decimal; }
    .prose-claude li { margin-bottom: 0.4rem; line-height: 1.7; }
    .prose-claude code:not(pre code) {
      background: var(--bg-elev-2);
      color: var(--accent-bright);
      padding: 0.15rem 0.4rem;
      border-radius: 0.3rem;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', monospace;
    }
    .prose-claude pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem 1.1rem;
      overflow-x: auto;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .prose-claude pre code { font-family: 'JetBrains Mono', monospace; color: var(--fg); }
    .prose-claude blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      color: var(--fg-muted);
      font-style: italic;
      margin: 1.25rem 0;
    }
    .prose-claude table { width: 100%; border-collapse: collapse; margin-bottom: 1.25rem; }
    .prose-claude th, .prose-claude td {
      border: 1px solid var(--border);
      padding: 0.55rem 0.75rem;
      text-align: left;
    }
    .prose-claude th { background: var(--bg-elev); font-weight: 600; }
    .prose-claude img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1rem 0; }
    .prose-claude hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .day-card:hover { transform: none; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[var(--bg)] text-[var(--fg)]">
  <a href="#main" class="skip-link">Skip to content</a>

  {% include 'partials/header.html' %}

  <main id="main" class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% include 'partials/footer.html' %}
</body>
</html>
