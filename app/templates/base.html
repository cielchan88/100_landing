<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}100 Days with Claude{% endblock %}</title>

  <meta name="description" content="Building one web project every day, for 100 days.">
  <meta name="theme-color" content="#0F0F0E">

  <meta property="og:title" content="100 Days with Claude">
  <meta property="og:description" content="Building one web project every day, for 100 days.">
  <meta property="og:url" content="https://100dayswithclaude.pythonanywhere.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="100 Days with Claude">
  <meta name="twitter:description" content="Building one web project every day, for 100 days.">

  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg: #0F0F0E;
      --surface: #1A1816;
      --text: #FAFAF7;
      --muted: #A8A29E;
      --accent: #D97757;
      --accent-hover: #E8916F;
      --border: rgba(217, 119, 87, 0.15);
      --pre-bg: #0A0A09;
    }

    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    html { background: var(--bg); }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    code, .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    ::selection { background: var(--accent); color: var(--bg); }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--accent);
      color: var(--bg);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      z-index: 100;
    }
    .skip-link:focus { left: 1rem; top: 1rem; }

    a:focus-visible,
    button:focus-visible,
    .day-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 6px;
    }

    .day-card { transition: transform 200ms ease, border-color 200ms ease, background 200ms ease; }
    .day-card:hover {
      border-color: var(--accent) !important;
      background: #211F1C !important;
    }

    .prose-custom { max-width: 65ch; }
    .prose-custom p { line-height: 1.7; margin-bottom: 1.25rem; color: var(--text); }
    .prose-custom h2 { font-size: 1.5rem; font-weight: 600; margin-top: 2.5rem; margin-bottom: 1rem; color: var(--text); letter-spacing: -0.01em; }
    .prose-custom h3 { font-size: 1.25rem; font-weight: 600; margin-top: 2rem; margin-bottom: 0.75rem; color: var(--text); }
    .prose-custom h4 { font-size: 1.05rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; color: var(--text); }
    .prose-custom ul, .prose-custom ol { margin-left: 1.5rem; margin-bottom: 1.25rem; }
    .prose-custom ul { list-style: disc; }
    .prose-custom ol { list-style: decimal; }
    .prose-custom li { margin-bottom: 0.5rem; line-height: 1.7; }
    .prose-custom a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .prose-custom a:hover { color: var(--accent-hover); }
    .prose-custom code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875em;
      background: var(--surface);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      color: var(--accent-hover);
    }
    .prose-custom pre {
      background: var(--pre-bg);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }
    .prose-custom pre code {
      background: transparent;
      padding: 0;
      color: var(--text);
      font-size: 0.9rem;
    }
    .prose-custom blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      color: var(--muted);
      font-style: italic;
      margin: 1.25rem 0;
    }
    .prose-custom hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
    .prose-custom img { max-width: 100%; height: auto; border-radius: 6px; margin: 1rem 0; }
    .prose-custom table { width: 100%; border-collapse: collapse; margin-bottom: 1.25rem; }
    .prose-custom th, .prose-custom td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
    .prose-custom th { background: var(--surface); font-weight: 600; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .day-card:hover { transform: none !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <a href="#main" class="skip-link">Skip to content</a>

  {% include 'partials/header.html' %}

  <main id="main" class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% include 'partials/footer.html' %}
</body>
</html>
