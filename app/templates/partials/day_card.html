<a href="/days/{{ day.slug }}"
   class="day-card group relative block p-5 rounded-xl border"
   style="background: var(--surface); border-color: var(--border);"
   aria-label="Day {{ day.day|pad2 }}: {{ day.title }}">
  <span class="mono block text-2xl mb-3" style="color: var(--accent); opacity: 0.6;">{{ day.day|pad2 }}</span>
  <h3 class="text-base font-medium leading-snug"
      style="color: var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">
    {{ day.title }}
  </h3>
  <p class="text-sm mt-1 truncate" style="color: var(--muted);">{{ day.tagline }}</p>
</a>
